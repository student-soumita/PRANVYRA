<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041226"/>
      <stop offset="60%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="sensorGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#041226" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgAir)"/>
  <circle cx="400" cy="220" r="260" fill="url(#sensorGlow)"/>

  <!-- Atmospheric Wave Isobars -->
  <path d="M-50 280 C 150 200, 300 340, 500 240 S 750 300, 850 210" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.6"/>
  <path d="M-50 320 C 180 240, 350 380, 540 280 S 780 340, 850 250" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.45"/>
  <path d="M-50 360 C 200 280, 380 420, 580 320 S 800 380, 850 290" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>

  <!-- Concentric Radar / Sensor Scan Ring -->
  <circle cx="400" cy="220" r="140" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5"/>
  <circle cx="400" cy="220" r="85" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
  <circle cx="400" cy="220" r="30" fill="#10b981" opacity="0.25"/>

  <!-- Central Sensor Core Icon Graphic -->
  <g transform="translate(376, 196)" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
  </g>

  <!-- Particle Dots In Flow -->
  <circle cx="240" cy="260" r="3" fill="#fef08a" opacity="0.8"/>
  <circle cx="280" cy="210" r="2" fill="#34d399" opacity="0.7"/>
  <circle cx="350" cy="290" r="2.5" fill="#06b6d4" opacity="0.8"/>
  <circle cx="480" cy="180" r="3" fill="#10b981" opacity="0.9"/>
  <circle cx="550" cy="260" r="2" fill="#fef08a" opacity="0.6"/>
  <circle cx="620" cy="230" r="3.5" fill="#34d399" opacity="0.85"/>
</svg>
