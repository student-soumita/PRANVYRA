<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pranvyraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A88A" />
      <stop offset="50%" stop-color="#101A30" />
      <stop offset="100%" stop-color="#A6E8D5" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#101A30" />
      <stop offset="100%" stop-color="#16A88A" />
    </linearGradient>
    <linearGradient id="windGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A6E8D5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#16A88A" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  
  <!-- Outer Atmospheric Halo Circle -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#pranvyraGrad)" stroke-width="3" stroke-dasharray="160 30" stroke-linecap="round" opacity="0.85" />
  
  <!-- Atmospheric Glow Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#16A88A" stroke-width="1.2" opacity="0.3" />

  <!-- Air Current Wind Streamline 1 -->
  <path d="M 22 44 C 34 32, 54 30, 68 38 C 76 43, 80 52, 74 60 C 68 67, 56 66, 52 58 C 49 52, 52 46, 57 44" 
        fill="none" stroke="url(#windGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Central Botanical Leaf -->
  <path d="M 32 68 C 32 52, 48 36, 68 32 C 68 50, 52 68, 32 68 Z" 
        fill="url(#leafGrad)" />
        
  <!-- Leaf Central Vein (representing respiration & bio-circulation) -->
  <path d="M 36 64 C 46 54, 56 44, 64 36" 
        fill="none" stroke="#B9E8D7" stroke-width="2" stroke-linecap="round" opacity="0.8" />
        
  <!-- Subtle Second Breeze Streamline -->
  <path d="M 24 58 C 30 62, 38 64, 46 62" 
        fill="none" stroke="#B9E8D7" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>

