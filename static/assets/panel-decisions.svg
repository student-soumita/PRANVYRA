<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDecisions" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="navGlow" cx="55%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b132b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgDecisions)"/>
  <circle cx="440" cy="230" r="280" fill="url(#navGlow)"/>

  <!-- Clean Commute BreathRoute Highway Corridors -->
  <path d="M100 450 Q 250 350, 320 270 T 480 200 T 700 80" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 450 Q 250 350, 320 270 T 480 200 T 700 80" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="12,14" stroke-linecap="round"/>

  <!-- Alternative High-Pollution Route (Red/Orange, Diverting Away) -->
  <path d="M100 450 Q 210 280, 400 320 T 680 340" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,8" opacity="0.45"/>

  <!-- AI Neural Network Nodes / Waypoints -->
  <circle cx="100" cy="450" r="8" fill="#10b981"/>
  <circle cx="100" cy="450" r="16" fill="none" stroke="#10b981" opacity="0.5"/>

  <circle cx="320" cy="270" r="6" fill="#38bdf8"/>
  <circle cx="320" cy="270" r="14" fill="none" stroke="#38bdf8" opacity="0.5"/>

  <circle cx="480" cy="200" r="7" fill="#818cf8"/>
  <circle cx="480" cy="200" r="16" fill="none" stroke="#818cf8" opacity="0.5"/>

  <circle cx="700" cy="80" r="9" fill="#34d399"/>
  <circle cx="700" cy="80" r="22" fill="none" stroke="#34d399" opacity="0.6"/>

  <!-- Compass / AI Navigator Graphic -->
  <g transform="translate(450, 170)" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12 2 19 21 12 17 5 21 12 2" fill="rgba(52, 211, 153, 0.3)"/>
  </g>
</svg>
